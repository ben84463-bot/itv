name: 抓取關係人交易（公開資訊觀測站）

on:
  schedule:
    - cron: '17 * * * *'          # 每小時一批，每批最多 50 分鐘（同時只跑一批）
  workflow_dispatch:
    inputs:
      tickers:
        description: '股票代號（逗號分隔，留空則跑排程模式）'
        required: false
        default: ''
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '抓取')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.12.3
      - name: 決定要抓的代號
        id: pick
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          INPUT_TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          T=""
          if [ -n "$ISSUE_TITLE" ]; then T=$(echo "$ISSUE_TITLE" | grep -oE '[0-9]{4,6}' | head -5 | paste -sd, -); fi
          if [ -z "$T" ] && [ -n "$INPUT_TICKERS" ]; then T=$(echo "$INPUT_TICKERS" | grep -oE '[0-9]{4,6}' | head -30 | paste -sd, -); fi
          echo "tickers=$T" >> "$GITHUB_OUTPUT"
      - name: 抓取
        run: |
          if [ -n "${{ steps.pick.outputs.tickers }}" ]; then
            python crawler/mops_rpt.py --tickers "${{ steps.pick.outputs.tickers }}" --budget 40
          else
            python crawler/mops_rpt.py --auto --budget 50
          fi
      - name: 提交資料
        run: |
          git config user.name "rpt-crawler"
          git config user.email "actions@users.noreply.github.com"
          git add data/rpt
          git diff --cached --quiet || git commit -m "更新關係人交易資料 $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - name: 回覆 Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          T: ${{ steps.pick.outputs.tickers }}
        run: |
          if [ -n "$T" ]; then MSG="已抓取：$T。網頁重新整理後即可看到（GitHub Pages 約需 1～2 分鐘更新）。"; else MSG="標題中沒有找到股票代號，請用「抓取 2313」的格式。"; fi
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$MSG"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
